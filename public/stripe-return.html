<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to Nexus</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F2EEE4; color: #1F201C; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
  a { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 999px; background: #3E4A26; color: #C5F37C; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Taking you back to Nexus…</h1>
  <p>Your tickets are in the app under My tickets.</p>
  <a id="open" href="nexus://tickets">Open Nexus</a>
</main>
<script>
  // Stripe returns here after checkout on iPhone and Android; hand the order back to the app.
  var target = 'nexus://tickets' + window.location.search;
  document.getElementById('open').href = target;
  window.location.replace(target);
</script>
</body>
</html>
